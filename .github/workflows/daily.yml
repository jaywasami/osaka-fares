name: 每日查價

on:
  schedule:
    - cron: "37 22 * * *"   # 06:37 台灣時間
  workflow_dispatch:
    inputs:
      test_message:
        description: "順便送一則 Telegram 測試訊息"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 查價、存檔、通知
        id: track
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          IGNAV_API_KEY: ${{ secrets.IGNAV_API_KEY }}
        run: python -m tracker.run ${{ inputs.test_message && '--test-message' || '' }}

      - name: 存回資料
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs/data.json
          git diff --cached --quiet || git commit -m "價格更新 $(TZ=Asia/Taipei date +%F)"
          git push

      - name: 全部出發日已過，停用排程
        if: steps.track.outputs.finished == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable daily.yml --repo "$GITHUB_REPOSITORY"
